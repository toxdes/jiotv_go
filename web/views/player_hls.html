<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JioTV Go</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: black;
        overflow-y: hidden;
      }

      .flowplayer .fp-ui [role="button"]:focus,
      .flowplayer .fp-play:focus,
      .flowplayer .fp-pause:focus {
        outline: 2px solid #2b7de9;
        outline-offset: 2px;
      }
    </style>
    <link rel="stylesheet" href="/static/external/flowplayer.css" />
    <script src="/static/external/flowplayer.min.js"></script>
    <script src="/static/external/hls.min.js"></script>
    <script src="/static/external/qsel.min.js"></script>
    <script src="/static/external/asel.min.js"></script>
    <script src="/static/external/keyboard.min.js"></script>
  </head>

  <body>
    <div id="jiotv_go_player"></div>
    <script>
      var shouldAutoplay = {{if .autoplay_fallback}}true{{else}}false{{end}};
      var player = flowplayer("#jiotv_go_player", {
        src: "{{ .play_url }}",
        auto_orient: true,
        live: {{if .is_catchup}}false{{else}}true{{end}},
        seekable: {{if .is_catchup}}true{{else}}false{{end}},
        retry: {{if .is_catchup}}false{{else}}true{{end}},
        autoplay: false,
        muted: false,
        qsel: {},
        asel: {},
        hlsjs: {
            // Disable capping level to player size to allow high quality on small screens
            capLevelToPlayerSize: false,
            // Try to start with best quality if possible (auto mode usually does this based on bandwidth)
            startLevel: -1
        },
        ui: flowplayer.ui.USE_THIN_CONTROLBAR,
      });

      // JTV: max volume for TV remote usage
      player.volumeLevel = 1;

      var tv2Hls = null;
      function isTV2Frame() {
        try {
          return window.parent !== window && window.parent.location.pathname === "/tv2";
        } catch (e) {
          return false;
        }
      }
      function isHindiAudioTrack(track) {
        var language = String(track.lang || track.language || "").toLowerCase();
        var label = String(track.name || track.label || "").toLowerCase();
        return language === "hi" || language === "hin" || label.indexOf("hindi") !== -1;
      }
      function getTV2AudioTracks() {
        if (tv2Hls && tv2Hls.audioTracks) {
          return tv2Hls.audioTracks.map(function (track, index) {
            return {
              id: "hls:" + track.id,
              language: track.lang || "",
              label: track.name || track.lang || ("Audio " + (index + 1)),
              active: tv2Hls.audioTrack === track.id
            };
          });
        }
        var video = document.querySelector("#jiotv_go_player video");
        var tracks = video && video.audioTracks;
        if (!tracks) return [];
        var result = [];
        for (var i = 0; i < tracks.length; i++) {
          result.push({
            id: "native:" + i,
            language: tracks[i].language || "",
            label: tracks[i].label || tracks[i].language || ("Audio " + (i + 1)),
            active: !!tracks[i].enabled
          });
        }
        return result;
      }
      function selectTV2AudioTrack(id) {
        var value = String(id || "");
        if (value.indexOf("hls:") === 0 && tv2Hls) {
          tv2Hls.audioTrack = Number(value.slice(4));
          return;
        }
        if (value.indexOf("native:") === 0) {
          var video = document.querySelector("#jiotv_go_player video");
          var tracks = video && video.audioTracks;
          var selected = Number(value.slice(7));
          if (tracks && tracks[selected]) {
            for (var i = 0; i < tracks.length; i++) tracks[i].enabled = i === selected;
          }
        }
      }
      function publishTV2AudioTracks() {
        if (!isTV2Frame()) return;
        window.parent.postMessage({ type: "audioTracks", tracks: getTV2AudioTracks() }, window.location.origin);
      }
      function preferHindiAudio() {
        if (!isTV2Frame()) return;
        var tracks = getTV2AudioTracks();
        for (var i = 0; i < tracks.length; i++) {
          if (isHindiAudioTrack(tracks[i])) {
            selectTV2AudioTrack(tracks[i].id);
            break;
          }
        }
      }
      function attachTV2Hls(candidate) {
        var hls = candidate && (candidate.hls || candidate);
        if (!hls || !hls.audioTracks || tv2Hls === hls) return;
        tv2Hls = hls;
        if (window.Hls && Hls.Events) {
          hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, function () {
            preferHindiAudio();
            publishTV2AudioTracks();
          });
          hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, publishTV2AudioTracks);
        }
        preferHindiAudio();
        publishTV2AudioTracks();
      }
      window.jiotvTV2Audio = { getTracks: getTV2AudioTracks, select: selectTV2AudioTrack };
      player.on("hls:attached", function (event, data) {
        attachTV2Hls((data && data.hls) ? data : event);
      });
      setTimeout(function () {
        attachTV2Hls(player.hls || (player.engine && player.engine.hls));
        preferHindiAudio();
        publishTV2AudioTracks();
      }, 1500);

      // Mirror the DRM player's autoplay policy: try with sound first, then
      // retry muted only when the browser rejects unmuted autoplay.
      if (shouldAutoplay) {
        (function tryAutoplay(attempts) {
          var video = document.querySelector("#jiotv_go_player video");
          if (!video) {
            if (attempts < 100) setTimeout(function () { tryAutoplay(attempts + 1); }, 50);
            return;
          }

          video.muted = false;
          var playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {
              video.muted = true;
              video.play().catch(function () {});
            });
          }
        })(0);
      }

      function initDpadRemoteSupport() {
        const playerRoot = document.querySelector(".flowplayer");
        if (!playerRoot) {
          return false;
        }

        // JTV: skip control focus in TV iframe mode
        const tvMode = window.parent !== window;

        const isArrowKey = (event) => {
          return (
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key) ||
            [37, 38, 39, 40].includes(event.keyCode)
          );
        };

        const isActivateKey = (event) => {
          return event.key === "Enter" || event.key === " " || [13, 32].includes(event.keyCode);
        };

        const isMediaToggleKey = (event) => {
          return event.key === "MediaPlayPause" || [179, 415, 19].includes(event.keyCode);
        };

        const getFocusableControls = () => {
          const controls = Array.from(
            playerRoot.querySelectorAll(
              '.fp-ui [role="button"], .fp-ui .fp-play, .fp-ui .fp-pause'
            )
          );
          // JTV: don't make controls focusable in TV iframe mode
          if (!tvMode) {
            controls.forEach((control) => {
              if (!control.hasAttribute("tabindex") || control.getAttribute("tabindex") === "-1") {
                control.setAttribute("tabindex", "0");
              }
            });
          }
          return controls;
        };

        const getPlayPauseControl = () => {
          return (
            playerRoot.querySelector('.fp-ui .fp-pause') ||
            playerRoot.querySelector('.fp-ui .fp-play')
          );
        };

        // JTV: skip control focus in TV iframe mode
        const focusPlayPauseControl = () => {
          if (tvMode) return false;
          const controls = getFocusableControls();
          const target = getPlayPauseControl() || controls[0];
          if (!target) {
            return false;
          }

          playerRoot.classList.add("is-hovered");
          target.focus();
          return true;
        };

        const isInsidePlayer = (element) => {
          return !!(element && element.closest && element.closest(".flowplayer"));
        };

        document.addEventListener("keydown", (event) => {
          if (isMediaToggleKey(event)) {
            event.preventDefault();
            player.togglePlay();
            // JTV: skip control focus in TV iframe mode
            if (!tvMode) focusPlayPauseControl();
            return;
          }

          // JTV: skip arrow key control navigation in TV iframe mode
          if (tvMode) return;

          if (isArrowKey(event) && !isInsidePlayer(document.activeElement)) {
            if (focusPlayPauseControl()) {
              event.preventDefault();
              event.stopPropagation();
            }
            return;
          }

          if (!isActivateKey(event)) {
            return;
          }

          const activeElement = document.activeElement;
          if (
            activeElement &&
            activeElement.matches &&
            activeElement.matches('.flowplayer .fp-ui .fp-play, .flowplayer .fp-ui .fp-pause')
          ) {
            event.preventDefault();
            activeElement.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          }
        });

        // Some TV browsers do not support Tab navigation, so seed focus once controls exist.
        setTimeout(() => {
          getFocusableControls();
        }, 300);

        return true;
      }

      let dpadRetryCount = 0;
      const dpadInitTimer = setInterval(() => {
        if (initDpadRemoteSupport() || dpadRetryCount > 12) {
          clearInterval(dpadInitTimer);
          return;
        }
        dpadRetryCount += 1;
      }, 200);

      player.on(flowplayer.events.FULLSCREEN_ENTER, (e) => {
        // rotate to landscape on mobile devices
        if (screen.orientation) {
          screen.orientation.lock("landscape").catch((e) => {
            if (e.name === "NotSupportedError") {
              // ignore
            } else {
              console.error(e);
            }
          });
        }
      });
      player.on(flowplayer.events.FULLSCREEN_EXIT, (e) => {
        // release orientation lock on mobile devices
        if (screen.orientation) {
          screen.orientation.unlock();
        }
      });
    </script>
    <!-- JTV: TV remote support (self-guarding, no-op on desktop) -->
    <script src="/static/internal/player_tv.js"></script>
  </body>
</html>
