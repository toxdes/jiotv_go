<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    <style>
      :root {
        --tv-card-size: 160px;
        --tv-gap: 1rem;
        --tv-bg: #0d1117;
        --tv-card-bg: #161b22;
        --tv-card-focus-bg: #1c2333;
        --tv-border: #30363d;
        --tv-text: #e6edf3;
        --tv-accent: #ea4335;
        --tv-logo-bg: #21262d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        overflow-y: auto;
        overflow-x: hidden;
        background-color: var(--tv-bg);
        color: var(--tv-text);
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      html { scroll-behavior: smooth; }

      .tv-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: linear-gradient(180deg, var(--tv-bg) 70%, transparent);
        padding: 1.25rem 2rem 0.75rem;
      }

      .tv-header-inner {
        display: flex;
        align-items: center;
        gap: 1rem;
        max-width: 1800px;
        margin: 0 auto;
      }

      .tv-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--tv-accent);
        white-space: nowrap;
      }

      .tv-search {
        flex: 1;
        max-width: 420px;
        height: 3rem;
        padding: 0 1.25rem;
        border: 2px solid var(--tv-border);
        border-radius: 0.75rem;
        background: var(--tv-card-bg);
        color: var(--tv-text);
        font-size: 1.1rem;
        outline: none;
      }

      .tv-search:focus { border-color: var(--tv-accent); }

      .tv-quality-select {
        height: 3rem;
        padding: 0 1rem;
        border: 2px solid var(--tv-border);
        border-radius: 0.75rem;
        background: var(--tv-card-bg);
        color: var(--tv-text);
        font-size: 1.1rem;
        outline: none;
        cursor: pointer;
      }

      .tv-quality-select:focus { border-color: var(--tv-accent); }

      .tv-fav-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 3rem;
        width: 3rem;
        padding: 0;
        border: 2px solid var(--tv-border);
        border-radius: 0.75rem;
        background: var(--tv-card-bg);
        color: var(--tv-text);
        font-size: 1.3rem;
        cursor: pointer;
        outline: none;
        flex-shrink: 0;
      }

      .tv-fav-btn:focus { border-color: var(--tv-accent); }

      .tv-fav-btn.active {
        border-color: var(--tv-accent);
        color: var(--tv-accent);
        background: rgba(234, 67, 53, 0.1);
      }

      .tv-fav-btn svg {
        width: 1.4rem;
        height: 1.4rem;
        pointer-events: none;
      }

      .tv-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: var(--tv-gap);
        padding: 1rem 2rem 3rem;
        max-width: 1800px;
        margin: 0 auto;
        contain: layout style;
      }

      .tv-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.25rem 0.75rem;
        border: 3px solid transparent;
        border-radius: 1rem;
        background: var(--tv-card-bg);
        text-decoration: none;
        color: inherit;
        outline: none;
        cursor: pointer;
        min-height: var(--tv-card-size);
        content-visibility: auto;
        contain-intrinsic-size: auto 160px;
        contain: layout style paint;
      }

      .tv-card:focus {
        border-color: var(--tv-accent);
        background: var(--tv-card-focus-bg);
        content-visibility: visible;
      }

      .tv-card.hidden {
        display: none;
        content-visibility: hidden;
      }

      .tv-card-logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: contain;
        background: var(--tv-logo-bg);
        flex-shrink: 0;
      }

      .tv-card-name {
        font-size: 1.05rem;
        font-weight: 600;
        text-align: center;
        line-height: 1.3;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .tv-card-id {
        font-size: 0.75rem;
        opacity: 0.4;
      }

      .tv-no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 3rem;
        font-size: 1.25rem;
        opacity: 0.5;
      }

      #tv-player-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #000;
        display: none;
      }

      #tv-player-overlay.active {
        display: block;
      }

      #tv-player-iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      @media (min-width: 1920px) {
        .tv-grid { grid-template-columns: repeat(7, 1fr); }
      }

      @media (min-width: 1400px) and (max-width: 1919px) {
        .tv-grid { grid-template-columns: repeat(6, 1fr); }
      }

      @media (min-width: 1100px) and (max-width: 1399px) {
        .tv-grid { grid-template-columns: repeat(5, 1fr); }
      }
    </style>
  </head>

  <body>
    <div class="tv-header">
      <div class="tv-header-inner">
        <div class="tv-title">{{ .Title }}</div>
        <input
          id="tv-search-input"
          type="text"
          class="tv-search"
          placeholder="Search channels..."
          autocomplete="off"
          inputmode="search"
        />
        <button id="tv-fav-btn" class="tv-fav-btn" title="Toggle favorites" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
          </svg>
        </button>
        <select id="tv-quality-select" class="tv-quality-select">
          {{ range $key, $value := .Qualities }}
          <option value="{{ $key }}">{{ $value }}</option>
          {{ end }}
        </select>
      </div>
    </div>

    <div id="tv-num-overlay" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(234,67,53,0.9); color:#fff; font-size:3rem; font-weight:700; padding:1rem 2rem; border-radius:1rem; z-index:999; pointer-events:none; text-shadow:0 2px 4px rgba(0,0,0,0.4);">
    </div>

    <div id="tv-channel-grid" class="tv-grid">
      {{range $channel := .Channels}}
      <a
        href="/tv/play/{{ $channel.ID }}?name={{ urlquery $channel.Name }}"
        class="tv-card"
        data-channel-id="{{ $channel.ID }}"
        data-channel-name="{{ $channel.Name }}"
        tabindex="0"
      >
        <img
          src="{{ $channel.LogoURL }}"
          alt="{{ $channel.Name }}"
          class="tv-card-logo"
          loading="lazy"
          decoding="async"
        />
        <span class="tv-card-name">{{ $channel.Name }}</span>
        <span class="tv-card-id">ID:{{ $channel.ID }}</span>
      </a>
      {{end}}
      <div id="tv-no-results" class="tv-no-results" style="display:none">No channels found</div>
    </div>

    <div id="tv-player-overlay">
      <iframe id="tv-player-iframe" allow="autoplay; fullscreen" allowfullscreen webkitallowfullscreen></iframe>
    </div>

    <script src="/static/internal/tv.js"></script>
  </body>
</html>
